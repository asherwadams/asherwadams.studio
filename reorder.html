<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Portfolio Editor — Asher Adams</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #1a1a18; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* HEADER */
header { background: #1a1a18; color: #f5f5f3; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
header h1 { font-size: 14px; font-weight: 500; letter-spacing: 0.02em; }
#header-btns { display: flex; gap: 8px; }
#btn-import { background: #3a3a38; color: #f5f5f3; border: none; padding: 7px 18px; border-radius: 5px; font-size: 13px; font-weight: 600; cursor: pointer; }
#btn-import:hover { background: #4a4a48; }
#btn-export { background: #fff; color: #1a1a18; border: none; padding: 7px 18px; border-radius: 5px; font-size: 13px; font-weight: 600; cursor: pointer; }
#btn-export:hover { background: #e8e8e6; }
.photo-thumb-placeholder { width: 100%; aspect-ratio: 4/3; background: #e8e8e6; display: flex; align-items: center; justify-content: center; }
.photo-thumb-placeholder span { font-size: 9px; color: #aaa; text-align: center; padding: 4px; word-break: break-all; }

/* LAYOUT */
#body { display: flex; flex: 1; overflow: hidden; }

/* SIDEBAR */
#sidebar { width: 200px; min-width: 200px; background: #fff; border-right: 1px solid #e8e8e6; display: flex; flex-direction: column; overflow: hidden; }
#sidebar-head { padding: 16px 16px 10px; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #999; font-weight: 600; }
#section-list { flex: 1; overflow-y: auto; }
.section-item {
  padding: 10px 16px; font-size: 13px; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
  border-left: 2px solid transparent; transition: background 0.1s;
}
.section-item:hover { background: #f5f5f3; }
.section-item.active { background: #f0ede8; border-left-color: #1a1a18; font-weight: 500; }
.section-count { font-size: 11px; color: #bbb; }
#add-section-area { padding: 12px 16px; border-top: 1px solid #f0f0ee; }
#new-section-input { width: 100%; font-size: 12px; padding: 6px 10px; border: 1px solid #e0e0e0; border-radius: 4px; outline: none; }
#new-section-input:focus { border-color: #1a1a18; }
#btn-add-section { margin-top: 6px; width: 100%; background: #1a1a18; color: #fff; border: none; padding: 7px; border-radius: 4px; font-size: 12px; cursor: pointer; }
#btn-add-section:hover { opacity: 0.8; }

/* MAIN */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* SECTION HEADER */
#section-header { padding: 16px 24px 12px; border-bottom: 1px solid #e8e8e6; background: #fff; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
#section-title { font-size: 15px; font-weight: 500; flex: 1; }
#section-actions { display: flex; gap: 8px; }
.sm-btn { background: #f0ede8; color: #1a1a18; border: none; padding: 6px 14px; border-radius: 4px; font-size: 12px; cursor: pointer; }
.sm-btn:hover { background: #e8e4de; }
.sm-btn.danger { background: #fdecea; color: #c0392b; }
.sm-btn.danger:hover { background: #f8d7d5; }

/* DROP ZONE */
#drop-zone {
  margin: 20px 24px 0; border: 1.5px dashed #ccc; border-radius: 8px;
  padding: 28px; text-align: center; cursor: pointer;
  transition: border-color 0.2s, background 0.2s; background: #fafafa;
  flex-shrink: 0;
}
#drop-zone.dragover { border-color: #1a1a18; background: #f0ede8; }
#drop-zone p { font-size: 13px; color: #aaa; }
#drop-zone strong { color: #555; }
#file-input { display: none; }

/* GRID */
#grid-wrap { flex: 1; overflow-y: auto; padding: 16px 24px 32px; }
#photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }

.photo-card {
  background: #fff; border-radius: 6px; overflow: hidden;
  cursor: grab; user-select: none; position: relative;
  transition: box-shadow 0.15s; border: 2px solid transparent;
}
.photo-card:active { cursor: grabbing; }
.photo-card.dragging { opacity: 0.35; }
.photo-card.drag-over { border-color: #1a1a18; box-shadow: 0 0 0 1px #1a1a18; }
.photo-thumb { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; pointer-events: none; }
.photo-footer { padding: 7px 9px 8px; }
.photo-name { font-size: 10px; color: #bbb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.photo-num { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.5); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 3px; font-family: monospace; }
.remove-btn { position: absolute; top: 5px; left: 5px; background: rgba(0,0,0,0.45); color: #fff; border: none; border-radius: 3px; padding: 2px 7px; font-size: 10px; cursor: pointer; opacity: 0; transition: opacity 0.15s; }
.photo-card:hover .remove-btn { opacity: 1; }
.star-btn { position: absolute; bottom: 5px; right: 5px; background: none; border: none; font-size: 16px; cursor: pointer; line-height: 1; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5)); opacity: 0.4; transition: opacity 0.15s, transform 0.1s; }
.star-btn:hover { opacity: 1; }
.photo-card.starred .star-btn { opacity: 1; }
.photo-card.starred { box-shadow: 0 0 0 2px #f5c518 inset; }

/* EMPTY STATE */
#empty-state { padding: 48px 24px; text-align: center; color: #bbb; font-size: 14px; display: none; }
#empty-state.visible { display: block; }

/* WELCOME STATE */
#welcome { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; color: #bbb; }
#welcome h2 { font-size: 15px; font-weight: 400; }
#welcome p { font-size: 13px; }

/* EXPORT MSG */
#export-msg { position: fixed; bottom: 24px; right: 24px; background: #1a1a18; color: #fff; padding: 12px 20px; border-radius: 6px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
#export-msg.show { opacity: 1; }

/* RENAME INPUT */
.section-item input.rename-input { font-size: 13px; border: none; outline: none; background: transparent; width: 80%; font-family: inherit; }
</style>
</head>
<body>

<header>
  <h1>Portfolio Editor — asherwadams.studio</h1>
  <div id="header-btns">
    <button id="btn-import" onclick="importManifest()">Import manifest + photos</button>
    <button id="btn-export" onclick="exportManifest()">Export manifest.json</button>
  </div>
</header>

<div id="body">

  <!-- SIDEBAR -->
  <nav id="sidebar">
    <div id="sidebar-head">Sections</div>
    <div id="section-list"></div>
    <div id="add-section-area">
      <input id="new-section-input" type="text" placeholder="New section name..." maxlength="40">
      <button id="btn-add-section" onclick="addSection()">+ Add section</button>
    </div>
  </nav>

  <!-- MAIN AREA -->
  <div id="main">
    <div id="welcome">
      <h2>Add a section to get started</h2>
      <p>Use the sidebar to create sections like "Hong Kong", "Japan" etc.</p>
    </div>

    <div id="section-view" style="display:none; flex-direction:column; flex:1; overflow:hidden;">
      <div id="section-header">
        <span id="section-title"></span>
        <div id="section-actions">
          <button class="sm-btn" onclick="renameSection()">Rename</button>
          <button class="sm-btn danger" onclick="deleteSection()">Delete section</button>
        </div>
      </div>

      <div id="drop-zone" onclick="document.getElementById('file-input').click()">
        <p><strong>Click to add photos</strong> or drag them here</p>
      </div>
      <input type="file" id="file-input" multiple accept="image/*">

      <div id="grid-wrap">
        <div id="empty-state">No photos in this section yet — drop some above.</div>
        <div id="photo-grid"></div>
      </div>
    </div>
  </div>
</div>

<div id="export-msg">manifest.json downloaded — upload to portfolio/ on GitHub</div>

<script>
// ---- DATA ----
const FAVORITES_ID = 'favorites';
let favoritesSection = { id: FAVORITES_ID, name: '★ Favorites', photos: [] };
let sections = [];
let activeSectionId = null;
let dragSrc = null;

const CAT_KEYS = {
  'Hong Kong': 'hk', 'Hiroshima': 'hiroshima', 'Kyoto': 'kyoto',
  'Osaka': 'osaka', 'Shanghai': 'shanghai', 'Tokyo': 'tokyo',
  'Greece': 'greece', 'Automotive': 'automotive',
  'Japan': 'japan', 'China': 'china', 'Belize': 'belize',
  'Canada': 'canada', 'United States': 'us'
};
const CAT_NAMES = {
  'hk': 'Hong Kong', 'hiroshima': 'Hiroshima', 'kyoto': 'Kyoto',
  'osaka': 'Osaka', 'shanghai': 'Shanghai', 'tokyo': 'Tokyo',
  'greece': 'Greece', 'automotive': 'Automotive',
  'japan': 'Japan', 'china': 'China', 'belize': 'Belize',
  'canada': 'Canada', 'us': 'United States'
};

function uid() { return Math.random().toString(36).slice(2, 9); }

// ---- RESOLVE SECTION (regular or favorites) ----
function resolveSection(id) {
  if (id === FAVORITES_ID) return favoritesSection;
  return sections.find(s => s.id === id);
}

// ---- SECTIONS ----
function addSection() {
  const input = document.getElementById('new-section-input');
  const name = input.value.trim();
  if (!name) return;
  const section = { id: uid(), name, photos: [] };
  sections.push(section);
  input.value = '';
  renderSidebar();
  setActiveSection(section.id);
}

document.getElementById('new-section-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addSection();
});

function setActiveSection(id) {
  activeSectionId = id;
  renderSidebar();
  renderMain();
}

function deleteSection() {
  if (!activeSectionId || activeSectionId === FAVORITES_ID) return;
  const s = resolveSection(activeSectionId);
  if (!confirm(`Delete section "${s.name}" and all its photos?`)) return;
  // unstar photos from favorites too
  s.photos.forEach(p => {
    const fi = favoritesSection.photos.findIndex(f => f.name === p.name);
    if (fi >= 0) favoritesSection.photos.splice(fi, 1);
  });
  sections = sections.filter(s => s.id !== activeSectionId);
  activeSectionId = sections.length ? sections[0].id : FAVORITES_ID;
  renderSidebar();
  renderMain();
}

function renameSection() {
  if (activeSectionId === FAVORITES_ID) return;
  const s = resolveSection(activeSectionId);
  const name = prompt('Rename section:', s.name);
  if (!name || !name.trim()) return;
  s.name = name.trim();
  renderSidebar();
  renderMain();
}

// ---- SIDEBAR ----
function renderSidebar() {
  const list = document.getElementById('section-list');
  list.innerHTML = '';

  // Favorites always first
  const favItem = document.createElement('div');
  favItem.className = 'section-item' + (activeSectionId === FAVORITES_ID ? ' active' : '');
  favItem.style.cssText = 'color:#b8860b; font-weight:500;';
  favItem.innerHTML = `<span>★ Favorites</span><span class="section-count">${favoritesSection.photos.length}</span>`;
  favItem.onclick = () => setActiveSection(FAVORITES_ID);
  list.appendChild(favItem);

  sections.forEach(s => {
    const item = document.createElement('div');
    item.className = 'section-item' + (s.id === activeSectionId ? ' active' : '');
    item.innerHTML = `<span>${s.name}</span><span class="section-count">${s.photos.length}</span>`;
    item.onclick = () => setActiveSection(s.id);
    list.appendChild(item);
  });
}

// ---- MAIN ----
function renderMain() {
  const welcome = document.getElementById('welcome');
  const view = document.getElementById('section-view');

  if (!activeSectionId) {
    welcome.style.display = 'flex';
    view.style.display = 'none';
    return;
  }

  welcome.style.display = 'none';
  view.style.display = 'flex';

  const s = resolveSection(activeSectionId);
  document.getElementById('section-title').textContent = s.name;

  // Hide drop zone and add-photo controls in Favorites
  const isFav = activeSectionId === FAVORITES_ID;
  document.getElementById('drop-zone').style.display = isFav ? 'none' : '';
  document.querySelector('#section-actions .sm-btn:not(.danger)').style.display = isFav ? 'none' : '';
  document.querySelector('#section-actions .danger').style.display = isFav ? 'none' : '';

  renderGrid();
}

function renderGrid() {
  const s = resolveSection(activeSectionId);
  if (!s) return;
  const isFav = activeSectionId === FAVORITES_ID;
  const grid = document.getElementById('photo-grid');
  const empty = document.getElementById('empty-state');
  grid.innerHTML = '';
  empty.classList.toggle('visible', s.photos.length === 0);
  if (isFav && s.photos.length === 0) {
    empty.textContent = 'No favorites yet — star photos in any section to add them here.';
  } else {
    empty.textContent = 'No photos in this section yet — drop some above.';
  }

  s.photos.forEach((photo, i) => {
    const card = document.createElement('div');
    card.className = 'photo-card';
    card.draggable = true;
    card.dataset.index = i;

    if (!isFav) card.classList.add('starred'); // city section starred photos always show star
    const thumbHtml = photo.src
      ? `<img class="photo-thumb" src="${photo.src}" alt="">`
      : `<div class="photo-thumb-placeholder"><span>${photo.name}</span></div>`;

    const starBtn = isFav
      ? `<button class="star-btn" onclick="unstarFromFavorites(${i})" title="Remove from portfolio" style="opacity:1">★</button>`
      : `<button class="star-btn" onclick="toggleStar(${i})" title="Add/remove from portfolio">★</button>`;

    card.innerHTML = `
      ${thumbHtml}
      <div class="photo-num">${i + 1}</div>
      ${isFav ? '' : `<button class="remove-btn" onclick="removePhoto(${i})">✕</button>`}
      ${starBtn}
      <div class="photo-footer"><div class="photo-name">${photo.name}</div></div>
    `;

    card.addEventListener('dragstart', e => {
      dragSrc = { sectionId: activeSectionId, index: i };
      setTimeout(() => card.classList.add('dragging'), 0);
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      document.querySelectorAll('.photo-card').forEach(c => c.classList.remove('drag-over'));
    });
    card.addEventListener('dragover', e => {
      e.preventDefault();
      document.querySelectorAll('.photo-card').forEach(c => c.classList.remove('drag-over'));
      card.classList.add('drag-over');
    });
    card.addEventListener('drop', e => {
      e.preventDefault();
      if (!dragSrc || dragSrc.sectionId !== activeSectionId) return;
      const from = dragSrc.index;
      const to = parseInt(card.dataset.index);
      if (from === to) return;
      const moved = s.photos.splice(from, 1)[0];
      s.photos.splice(to, 0, moved);
      dragSrc = null;
      renderGrid();
      renderSidebar();
    });

    grid.appendChild(card);
  });
}

function removePhoto(i) {
  const s = resolveSection(activeSectionId);
  const photo = s.photos[i];
  // also remove from favorites
  const fi = favoritesSection.photos.findIndex(f => f.name === photo.name);
  if (fi >= 0) favoritesSection.photos.splice(fi, 1);
  s.photos.splice(i, 1);
  renderGrid();
  renderSidebar();
}

function toggleStar(i) {
  const s = resolveSection(activeSectionId);
  const photo = s.photos[i];
  const fi = favoritesSection.photos.findIndex(f => f.name === photo.name);
  if (fi >= 0) {
    // unstar — remove from favorites
    favoritesSection.photos.splice(fi, 1);
    photo.featured = false;
  } else {
    // star — add to favorites
    photo.featured = true;
    favoritesSection.photos.push({ ...photo, cat: sectionNameToCat(s.name) });
  }
  renderGrid();
  renderSidebar();
}

function unstarFromFavorites(i) {
  const favPhoto = favoritesSection.photos[i];
  favoritesSection.photos.splice(i, 1);
  // update featured flag in city section
  sections.forEach(s => {
    const p = s.photos.find(p => p.name === favPhoto.name);
    if (p) p.featured = false;
  });
  renderGrid();
  renderSidebar();
}

// ---- FILE INPUT ----
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  if (!activeSectionId || activeSectionId === FAVORITES_ID) return;
  addFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });

function addFiles(files) {
  const s = resolveSection(activeSectionId);
  if (!s || activeSectionId === FAVORITES_ID) return;
  Array.from(files).filter(f => f.type.startsWith('image/')).forEach(f => {
    if (s.photos.find(p => p.name === f.name)) return;
    s.photos.push({ name: f.name, src: URL.createObjectURL(f) });
  });
  renderGrid();
  renderSidebar();
}

// ---- IMPORT ----
function importManifest() {
  const manifestInput = document.createElement('input');
  manifestInput.type = 'file';
  manifestInput.accept = '.json';
  document.body.appendChild(manifestInput);
  manifestInput.click();
  manifestInput.onchange = async () => {
    const text = await manifestInput.files[0].text();
    document.body.removeChild(manifestInput);
    let entries;
    try { entries = JSON.parse(text); } catch(e) { alert('Invalid JSON'); return; }

    // Populate favorites (featured entries in manifest order)
    favoritesSection.photos = entries
      .filter(e => e.featured)
      .map(e => ({ name: e.src.replace('portfolio/', ''), src: null, featured: true, cat: e.cat }));

    // Group non-favorite entries by cat for city sections (but still include featured in city sections too)
    const catOrder = [], byCat = {};
    entries.forEach(e => {
      if (!byCat[e.cat]) { byCat[e.cat] = []; catOrder.push(e.cat); }
      byCat[e.cat].push(e);
    });

    sections = catOrder.map(cat => ({
      id: uid(),
      name: CAT_NAMES[cat] || cat,
      photos: byCat[cat].map(e => ({
        name: e.src.replace('portfolio/', ''),
        src: null,
        featured: e.featured || false,
        cat
      }))
    }));

    renderSidebar();
    setActiveSection(FAVORITES_ID);

    // Pick the photo folder
    const folderInput = document.createElement('input');
    folderInput.type = 'file';
    folderInput.multiple = true;
    folderInput.setAttribute('webkitdirectory', '');
    document.body.appendChild(folderInput);
    folderInput.click();
    folderInput.onchange = () => {
      const fileMap = {};
      Array.from(folderInput.files).forEach(f => { fileMap[f.name] = f; });
      document.body.removeChild(folderInput);
      // Apply srcs to city sections
      sections.forEach(s => {
        s.photos.forEach(p => { if (fileMap[p.name]) p.src = URL.createObjectURL(fileMap[p.name]); });
      });
      // Apply srcs to favorites (reuse same object URL)
      favoritesSection.photos.forEach(p => { if (fileMap[p.name]) p.src = URL.createObjectURL(fileMap[p.name]); });
      renderGrid();
      renderSidebar();
    };
  };
}

// ---- EXPORT ----
function sectionNameToCat(name) {
  for (const [label, key] of Object.entries(CAT_KEYS)) {
    if (name.toLowerCase() === label.toLowerCase()) return key;
  }
  return name.toLowerCase().replace(/\s+/g, '_');
}

function exportManifest() {
  if (sections.every(s => s.photos.length === 0) && favoritesSection.photos.length === 0) {
    alert('No photos to export yet.');
    return;
  }
  const manifest = [];
  const favNames = new Set(favoritesSection.photos.map(p => p.name));

  // Favorites first, in their drag order, with featured:true
  favoritesSection.photos.forEach(photo => {
    manifest.push({ src: 'portfolio/' + photo.name, cat: photo.cat, featured: true });
  });

  // Then all city section photos that are NOT favorited
  sections.forEach(s => {
    const cat = sectionNameToCat(s.name);
    s.photos.forEach(photo => {
      if (!favNames.has(photo.name)) {
        manifest.push({ src: 'portfolio/' + photo.name, cat });
      }
    });
  });

  const json = JSON.stringify(manifest, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'manifest.json';
  a.click();
  const msg = document.getElementById('export-msg');
  msg.classList.add('show');
  setTimeout(() => msg.classList.remove('show'), 3000);
}
</script>
</body>
</html>
